name: Migrations

# Only when the database changes, as each test starts its own PostgreSQL in Docker
on:
    push:
        branches: [main]
        paths: [packages/db/**]
    pull_request:
        paths: [packages/db/**]

concurrency:
    group: migrations-${{ github.ref }}
    cancel-in-progress: true

jobs:
    migrations:
        name: Database migrations
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter db test:migrations
